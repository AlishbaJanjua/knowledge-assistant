<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/widget.css">
</head>
<body class="widget-mode">

<div id="emailGate" class="gate">
    <div class="gate-card">
        <div class="gate-label" id="gateLabel">Enter your email to continue</div>
        <input id="email" type="email" placeholder="your@email.com" autocomplete="email">
        <div id="otpStep" class="otp-step hidden">
            <input id="otpInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code">
            <button type="button" class="btn-link" id="otpResend">Resend code</button>
        </div>
        <button type="button" id="continueBtn">Continue</button>
        <p id="emailError" class="gate-error" hidden>Please enter a valid email.</p>
    </div>
</div>

<div class="app widget-app hidden" id="app">
    <div class="widget-backdrop" id="sidebarBackdrop" hidden></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button type="button" class="btn-ghost" id="loadDocuments">Refresh documents</button>
            <button type="button" class="btn-ghost widget-close-sidebar" id="closeSidebar" aria-label="Close">✕</button>
        </div>

        <div class="sidebar-section">
            <div class="section-label">Documents</div>
            <div class="doc-list" id="documents"></div>
            <p class="doc-empty" id="docEmpty">No documents yet</p>
        </div>

        <div class="sidebar-footer">
            <label class="upload-zone" id="uploadZone">
                <span class="upload-zone-text">Upload document</span>
                <span class="upload-zone-hint">PDF, DOCX, PPTX, TXT</span>
                <input hidden type="file" id="fileUpload" accept=".pdf,.docx,.txt,.csv,.pptx,.md,.html,.htm">
            </label>
            <p class="user-email" id="userEmail"></p>
        </div>
    </aside>

    <main class="main">
        <header class="main-header">
            <button type="button" class="icon-btn widget-menu-btn" id="openSidebar" title="Documents & upload" aria-label="Documents">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h1 class="doc-title" id="docTitle">Knowledge Assistant</h1>
        </header>

        <div id="chunk-info"></div>

        <div class="messages" id="messages">
            <div class="empty-state" id="emptyState">
                <p>Open the menu to upload a document, then ask anything about it.</p>
            </div>
        </div>

        <div class="composer-wrap">
            <div class="composer">
                <textarea id="question" rows="1" placeholder="Ask something..." disabled></textarea>
                <button type="button" id="micBtn" class="icon-btn" title="Voice input" disabled>🎙️</button>
                <button type="button" id="sendBtn" class="icon-btn send" title="Send" disabled>➤</button>
            </div>
            <p class="composer-note" id="composerNote"></p>
        </div>
    </main>
</div>

<script src="/widget.js"></script>
</body>
</html>
