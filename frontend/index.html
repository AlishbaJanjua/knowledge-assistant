<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Auth gate: Login / Create account -->
    <div class="gate" id="gate">
        <div class="gate-card gate-card-wide">
            <div id="auth-choose" class="auth-choose">
                <p class="gate-label" id="choose-label">Welcome</p>
                <div class="gate-tabs" id="gate-tabs">
                    <button type="button" class="gate-tab" data-mode="login" id="tab-login">Login</button>
                    <button type="button" class="gate-tab" data-mode="register" id="tab-register">Create an account</button>
                </div>
            </div>

            <div id="auth-flow" class="auth-flow hidden">
                <button type="button" class="btn-link auth-back" id="auth-back">← Back</button>
                <p class="gate-label" id="gate-label">Login with your email</p>

                <div id="register-fields" class="register-fields hidden">
                    <input type="text" id="company-input" placeholder="Company name" autocomplete="organization">
                    <textarea id="prompt-input" rows="3" placeholder="Company chatbot instructions (optional)"></textarea>

                    <p class="gate-sublabel">Widget customization</p>
                    <input type="text" id="widget-title-input" placeholder="Chatbot title" value="Knowledge Assistant">
                    <input type="text" id="widget-welcome-input" placeholder="Welcome message" value="Ask me anything about your documents.">
                    <div class="widget-row">
                        <label class="widget-field">
                            <span>Accent color</span>
                            <input type="color" id="widget-color-input" value="#141414">
                        </label>
                        <label class="widget-field">
                            <span>Position</span>
                            <select id="widget-position-input">
                                <option value="bottom-right" selected>Bottom right</option>
                                <option value="bottom-left">Bottom left</option>
                            </select>
                        </label>
                    </div>
                </div>

                <input type="email" id="email-input" placeholder="you@example.com" autocomplete="email">

                <div id="otp-step" class="otp-step hidden">
                    <input type="text" id="otp-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code">
                    <button type="button" class="btn-link" id="otp-resend">Resend code</button>
                </div>

                <button type="button" id="email-submit">Send code</button>
                <p class="gate-error" id="gate-error" hidden></p>
                <p class="gate-hint" id="gate-hint">We'll email a one-time code to verify it's you.</p>
            </div>
        </div>
    </div>

    <div class="app hidden" id="app">

        <aside class="sidebar">
            <div class="sidebar-header">
                <button type="button" class="btn-ghost" id="new-chat">New conversation</button>
            </div>

            <div class="sidebar-section">
                <span class="section-label">Documents</span>
                <div class="doc-list" id="doc-list"></div>
                <p class="doc-empty" id="doc-empty">No documents yet</p>
            </div>

            <div class="sidebar-footer">
                <label class="upload-zone" id="upload-zone">
                    <input type="file" id="file-upload" hidden accept=".pdf,.docx,.txt,.csv,.pptx,.md,.html,.htm">
                    <span class="upload-zone-text">Upload document</span>
                    <span class="upload-zone-hint">PDF, DOCX, PPTX, TXT</span>
                </label>
                <p class="user-email" id="user-email"></p>
                <p class="tenant-id" id="tenant-id" hidden></p>
            </div>
        </aside>

        <main class="main">
            <header class="main-header">
                <h1 class="doc-title" id="doc-title">Document Assistant</h1>
            </header>

            <section class="messages" id="messages">
                <div class="empty-state" id="empty-state">
                    <p>Upload a document or choose one from the sidebar to begin.</p>
                </div>
            </section>

            <div class="composer-wrap">
                <div class="composer" id="composer">
                    <textarea
                        id="chat-input"
                        placeholder="Ask about your document..."
                        rows="1"
                        disabled
                    ></textarea>
                    <button type="button" class="icon-btn" id="mic-button" title="Voice input" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                    </button>
                    <button type="button" class="icon-btn send" id="send-button" title="Send" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                    </button>
                </div>
                <p class="composer-note" id="composer-note"></p>
            </div>
        </main>
    </div>

    <div class="toast" id="toast" hidden></div>

    <div class="upload-overlay hidden" id="upload-overlay">
        <div class="upload-panel">
            <div class="upload-spinner"></div>
            <p class="upload-status" id="upload-status">Uploading document</p>
            <p class="upload-filename" id="upload-filename"></p>
            <p class="upload-substatus" id="upload-substatus">Please wait…</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
